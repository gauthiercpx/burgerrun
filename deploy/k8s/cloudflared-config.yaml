tunnel: burgerrun
credentials-file: /etc/cloudflared/creds/credentials.json
metrics: 0.0.0.0:2000
grace-period: 30s

ingress:
  # Tout le trafic public va au jeu, WebSocket compris : cloudflared transmet l'upgrade tel quel.
  - hostname: burgerrun.gauthiercpx.dev
    service: http://burgerrun:80
  # Exigé par cloudflared : la règle de repli doit être la dernière.
  - service: http_status:404
