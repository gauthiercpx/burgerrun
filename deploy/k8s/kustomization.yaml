apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: burgerrun

resources:
  - app.yaml
  - cloudflared.yaml
  - ingress.yaml

images:
  # La seule ligne à changer pour déployer une nouvelle version : ArgoCD la voit au
  # prochain passage et remplace le pod. Revenir en arrière : `git revert`.
  - name: ghcr.io/gauthiercpx/burgerrun
    newTag: "sha-76e4d015e19dec4838f1d1174ac9e9ab19f96f1a"

# Engendré plutôt que déclaré : le nom du ConfigMap porte une empreinte de son contenu,
# donc modifier le routage du tunnel redémarre cloudflared, qui ne lit sa configuration
# qu'au démarrage.
configMapGenerator:
  - name: cloudflared
    files:
      - config.yaml=cloudflared-config.yaml
