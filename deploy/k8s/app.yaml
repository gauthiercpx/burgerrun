apiVersion: v1
kind: Service
metadata:
  name: burgerrun
  labels:
    app.kubernetes.io/name: burgerrun
spec:
  selector:
    app.kubernetes.io/name: burgerrun
  ports:
    - name: http
      port: 80
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: burgerrun
  labels:
    app.kubernetes.io/name: burgerrun
spec:
  # Un seul exemplaire, et ce n'est pas un oubli : les salons de course vivent en mémoire
  # du processus. Avec deux pods, deux amis dans le « même » salon pourraient atterrir
  # chacun sur un pod différent et ne jamais se voir.
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: burgerrun
  template:
    metadata:
      labels:
        app.kubernetes.io/name: burgerrun
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: burgerrun
          image: ghcr.io/gauthiercpx/burgerrun:latest
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 30
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 10m
              memory: 48Mi
            limits:
              cpu: 500m
              memory: 128Mi
